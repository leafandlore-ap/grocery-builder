<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grocery Planner</title>
<style>
:root{color-scheme:dark;--bg:#111820;--card:#1c2732;--text:#edf3f5;--accent:#63c5bb;--hover:#367f7a;--border:#394958;--danger:#c34c55;--input:#263440;--muted:#afbec8;--button-text:#102323}
:root[data-theme="light"]{color-scheme:light;--bg:#f4f7f6;--card:#fff;--text:#333;--accent:#2c7a7b;--hover:#236162;--border:#e2e8f0;--danger:#e53e3e;--input:#fff;--muted:#66717b;--button-text:#fff}
*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;line-height:1.5}
.container{max-width:1050px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:20px}header{grid-column:1/-1;background:var(--card);padding:16px 20px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
h1,h2{color:var(--accent);margin:0 0 14px}h1{font-size:1.7rem;margin:0}h2{font-size:1.3rem}.card{background:var(--card);border-radius:8px;padding:20px;box-shadow:0 1px 4px #0001}.left-column{display:flex;flex-direction:column;gap:20px}
button{border:0;background:var(--accent);color:var(--button-text);padding:9px 14px;border-radius:5px;cursor:pointer;font-weight:600;font-size:.9rem}button:hover{background:var(--hover)}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.outline{background:transparent;color:var(--accent);border:1px solid var(--accent)}.outline:hover{color:var(--button-text)}.danger{background:var(--danger);color:white}.danger:hover{background:#c53030}.small{padding:5px 9px;font-size:.8rem}.full{width:100%;margin-top:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.field-label{display:block;font-weight:600;margin:12px 0 5px}input[type=text],input[type=number]{width:100%;min-width:0;padding:9px;border:1px solid var(--border);border-radius:5px;font:inherit;background:var(--input);color:var(--text)}.ingredient-row{display:grid;grid-template-columns:2fr 1fr 1.2fr auto;gap:7px;margin:8px 0;align-items:center}
.recipe-row,.grocery-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}.recipe-row label,.grocery-row label{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;overflow-wrap:anywhere}input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;cursor:pointer}.checked-text{text-decoration:line-through;color:var(--muted)}.grocery-row:has(input:checked){opacity:.65}.muted{color:var(--muted);font-size:.9rem}.section-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.filters{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 14px}.filter{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:5px 12px}.filter:hover,.filter.active{background:var(--accent);color:var(--button-text)}.recipe-meta{display:flex;flex-direction:column;gap:1px}.recipe-meta small{color:var(--muted)}.recipe-actions{display:flex;gap:5px;flex-shrink:0}#notice{margin-top:10px;color:var(--accent)}#importInput{display:none}
@media(max-width:750px){.container{grid-template-columns:1fr}}@media(max-width:440px){.ingredient-row{grid-template-columns:1fr 1fr auto}.ingredient-row .ing-name{grid-column:1/-1}.recipe-actions{flex-direction:column}}
</style>
</head>
<body>
<div class="container">
<header><h1>🛒 Grocery Planner</h1><div class="actions"><button class="outline" id="themeBtn" type="button" aria-label="Switch to light mode">☀️ Light mode</button><button class="outline" id="exportBtn" type="button">Export JSON</button><button class="outline" id="importBtn" type="button">Import JSON</button><input type="file" id="importInput" accept=".json,application/json"></div></header>
<div class="left-column">
<section class="card"><h2 id="formTitle">Add New Recipe</h2><label class="field-label" for="recipeName">Recipe Name</label><input id="recipeName" type="text" placeholder="e.g., Spaghetti Carbonara"><label class="field-label" for="recipeCuisine">Cuisine (optional)</label><input id="recipeCuisine" type="text" list="cuisineSuggestions" placeholder="e.g., Italian"><datalist id="cuisineSuggestions"></datalist><label class="field-label">Ingredients</label><div id="ingredientInputs"></div><button class="outline full" id="addIngredientBtn" type="button">+ Add Ingredient Line</button><button class="full" id="saveRecipeBtn" type="button">Save Recipe</button><button class="outline full" id="cancelEditBtn" type="button" hidden>Cancel Editing</button><div id="notice" role="status"></div></section>
<section class="card"><h2>Your Meals</h2><div class="filters" id="cuisineFilters" aria-label="Filter recipes by cuisine"></div><div id="recipeList"></div></section>
</div>
<section class="card" style="align-self:start"><h2>Weekly Grocery List</h2><div class="section-footer"><span class="muted" id="groceryCount">0 items</span><button class="outline small" id="clearChecksBtn" type="button">Reset Checkmarks</button></div><div id="groceryList"></div></section>
</div>
<script>
'use strict';
const STORAGE_KEY='local_recipe_manager_data';
const CHECKS_KEY='grocery_planner_checked_items';
const THEME_KEY='grocery_planner_theme';
function setTheme(theme){const value=theme==='light'?'light':'dark';document.documentElement.dataset.theme=value;const button=el('themeBtn');button.textContent=value==='dark'?'☀️ Light mode':'🌙 Dark mode';button.setAttribute('aria-label','Switch to '+(value==='dark'?'light':'dark')+' mode');try{localStorage.setItem(THEME_KEY,value)}catch(error){console.warn('Theme preference could not be saved',error)}}
function initTheme(){let theme='dark';try{theme=localStorage.getItem(THEME_KEY)||'dark'}catch(error){}setTheme(theme)}
const el=id=>document.getElementById(id);
let recipes=[],selectedIds=new Set(),checkedItems=new Set(),activeCuisine='All',editingId=null;
function makeId(){return typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function'?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}
function normalizeCuisine(value){return String(value||'').trim().replace(/\s+/g,' ')}
function cuisineOf(recipe){return normalizeCuisine(recipe.cuisine)||'Uncategorized'}
function cuisineKey(value){return value.toLocaleLowerCase()}
function ingredientKey(name,unit){return JSON.stringify([String(name).trim().toLowerCase(),String(unit).trim().toLowerCase()])}
function loadData(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');recipes=Array.isArray(saved)?saved.filter(r=>r&&typeof r.name==='string'&&Array.isArray(r.ingredients)).map(r=>({...r,id:String(r.id||makeId()),cuisine:normalizeCuisine(r.cuisine)})):[];const checks=JSON.parse(localStorage.getItem(CHECKS_KEY)||'[]');checkedItems=new Set(Array.isArray(checks)?checks:[])}catch(error){console.error('Unable to load saved data:',error);recipes=[];checkedItems=new Set()}}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(recipes));localStorage.setItem(CHECKS_KEY,JSON.stringify([...checkedItems]));return true}catch(error){console.error(error);alert('Browser storage is unavailable. Export your recipes to back them up.');return false}}
function addIngredientRow(ingredient){const row=document.createElement('div');row.className='ingredient-row';row.innerHTML='<input class="ing-name" type="text" placeholder="Ingredient" aria-label="Ingredient name"><input class="ing-qty" type="number" step="any" min="0" placeholder="Qty" aria-label="Quantity"><input class="ing-unit" type="text" placeholder="Unit" aria-label="Unit"><button class="danger small" type="button" aria-label="Remove ingredient">X</button>';if(ingredient){row.querySelector('.ing-name').value=ingredient.name||'';row.querySelector('.ing-qty').value=ingredient.qty??'';row.querySelector('.ing-unit').value=ingredient.unit||''}row.querySelector('button').addEventListener('click',()=>{if(el('ingredientInputs').children.length>1)row.remove();else row.querySelectorAll('input').forEach(input=>input.value='')});el('ingredientInputs').appendChild(row);row.querySelector('.ing-name').focus()}
function resetForm(){editingId=null;el('recipeName').value='';el('recipeCuisine').value='';el('ingredientInputs').replaceChildren();addIngredientRow();el('formTitle').textContent='Add New Recipe';el('saveRecipeBtn').textContent='Save Recipe';el('cancelEditBtn').hidden=true;el('notice').textContent=''}
function saveRecipe(){const name=el('recipeName').value.trim();if(!name){alert('Please enter a recipe name.');el('recipeName').focus();return}const cuisine=normalizeCuisine(el('recipeCuisine').value);const ingredients=[];for(const row of el('ingredientInputs').querySelectorAll('.ingredient-row')){const ingredientName=row.querySelector('.ing-name').value.trim();const rawQty=row.querySelector('.ing-qty').value.trim();const unit=row.querySelector('.ing-unit').value.trim();if(!ingredientName)continue;const qty=rawQty===''?0:Number(rawQty);if(!Number.isFinite(qty)||qty<0){alert('Please enter a valid quantity for '+ingredientName);return}ingredients.push({name:ingredientName.toLowerCase(),qty,unit:unit.toLowerCase()})}if(!ingredients.length){alert('Please enter at least one ingredient.');return}const wasEditing=editingId!==null;if(wasEditing){const index=recipes.findIndex(r=>String(r.id)===editingId);if(index<0){alert('This recipe no longer exists.');resetForm();return}recipes[index]={...recipes[index],name,cuisine,ingredients}}else recipes.push({id:makeId(),name,cuisine,ingredients});persist();resetForm();el('notice').textContent=wasEditing?'Recipe updated!':'Recipe saved!';renderRecipes();renderGroceryList()}
function editRecipe(id){const recipe=recipes.find(r=>String(r.id)===id);if(!recipe)return;editingId=id;el('recipeName').value=recipe.name;el('recipeCuisine').value=recipe.cuisine||'';el('ingredientInputs').replaceChildren();if(recipe.ingredients.length)recipe.ingredients.forEach(addIngredientRow);else addIngredientRow();el('formTitle').textContent='Edit Recipe';el('saveRecipeBtn').textContent='Update Recipe';el('cancelEditBtn').hidden=false;el('notice').textContent='';el('recipeName').focus();window.scrollTo({top:0,behavior:'smooth'})}
function allCuisines(){const map=new Map();recipes.forEach(recipe=>{const cuisine=cuisineOf(recipe),key=cuisineKey(cuisine);if(!map.has(key))map.set(key,cuisine)});return [...map.values()].sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'}))}
function renderCuisineControls(){const cuisines=allCuisines();const filterContainer=el('cuisineFilters');filterContainer.replaceChildren();if(activeCuisine!=='All'&&!cuisines.some(c=>cuisineKey(c)===cuisineKey(activeCuisine)))activeCuisine='All';['All',...cuisines].forEach(cuisine=>{const button=document.createElement('button');button.type='button';button.className='filter'+(activeCuisine===cuisine?' active':'');button.textContent=cuisine;button.setAttribute('aria-pressed',String(activeCuisine===cuisine));button.addEventListener('click',()=>{activeCuisine=cuisine;renderRecipes()});filterContainer.appendChild(button)});const datalist=el('cuisineSuggestions');datalist.replaceChildren();cuisines.filter(c=>c!=='Uncategorized').forEach(cuisine=>{const option=document.createElement('option');option.value=cuisine;datalist.appendChild(option)})}
function renderRecipes(){renderCuisineControls();const container=el('recipeList');container.replaceChildren();const visible=recipes.filter(r=>activeCuisine==='All'||cuisineKey(cuisineOf(r))===cuisineKey(activeCuisine)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:'base'}));if(!visible.length){container.textContent=recipes.length?'No recipes in this cuisine.':'No recipes saved yet.';return}visible.forEach(recipe=>{const id=String(recipe.id),row=document.createElement('div');row.className='recipe-row';const label=document.createElement('label'),checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=selectedIds.has(id);checkbox.addEventListener('change',()=>{if(checkbox.checked)selectedIds.add(id);else selectedIds.delete(id);renderGroceryList()});const meta=document.createElement('span');meta.className='recipe-meta';const title=document.createElement('span');title.textContent=recipe.name;const subtitle=document.createElement('small');subtitle.textContent=cuisineOf(recipe);meta.append(title,subtitle);label.append(checkbox,meta);const actions=document.createElement('div');actions.className='recipe-actions';const edit=document.createElement('button');edit.type='button';edit.className='outline small';edit.textContent='Edit';edit.addEventListener('click',()=>editRecipe(id));const del=document.createElement('button');del.type='button';del.className='danger small';del.textContent='Delete';del.addEventListener('click',()=>{if(!confirm('Delete "'+recipe.name+'"?'))return;recipes=recipes.filter(r=>String(r.id)!==id);selectedIds.delete(id);if(editingId===id)resetForm();persist();renderRecipes();renderGroceryList()});actions.append(edit,del);row.append(label,actions);container.appendChild(row)})}
function renderGroceryList(){const container=el('groceryList');container.replaceChildren();const totals=new Map();recipes.forEach(recipe=>{if(!selectedIds.has(String(recipe.id)))return;recipe.ingredients.forEach(ingredient=>{const name=String(ingredient.name||'').trim().toLowerCase(),unit=String(ingredient.unit||'').trim().toLowerCase(),qty=Number(ingredient.qty)||0;if(!name)return;const key=ingredientKey(name,unit);totals.set(key,(totals.get(key)||0)+qty)})});const sorted=[...totals.entries()].sort((a,b)=>{const [nameA,unitA]=JSON.parse(a[0]);const [nameB,unitB]=JSON.parse(b[0]);return nameA.localeCompare(nameB,undefined,{sensitivity:'base'})||unitA.localeCompare(unitB,undefined,{sensitivity:'base'})});el('groceryCount').textContent=sorted.filter(([key])=>checkedItems.has(key)).length+' of '+sorted.length+' checked';if(!sorted.length){container.textContent='Select meals to build your grocery list.';return}sorted.forEach(([key,qty])=>{const [name,unit]=JSON.parse(key),row=document.createElement('div');row.className='grocery-row';const label=document.createElement('label'),checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=checkedItems.has(key);const span=document.createElement('span');const formattedQty=Number(qty.toFixed(2));span.textContent=(qty>0?formattedQty+(unit?' '+unit:'')+' ':'')+name.charAt(0).toUpperCase()+name.slice(1);if(checkbox.checked)span.classList.add('checked-text');checkbox.addEventListener('change',()=>{if(checkbox.checked)checkedItems.add(key);else checkedItems.delete(key);persist();renderGroceryList()});label.append(checkbox,span);row.append(label);container.append(row)})}
function exportRecipes(){if(!recipes.length){alert('There are no recipes to export.');return}const blob=new Blob([JSON.stringify(recipes,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='recipe_backup.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importRecipes(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data)||!data.every(r=>r&&typeof r.name==='string'&&Array.isArray(r.ingredients)&&r.ingredients.every(i=>i&&typeof i.name==='string')))throw new Error('Invalid recipe format.');if(!confirm('Replace your current recipes with the imported recipes?'))return;const used=new Set();recipes=data.map(r=>{let id=String(r.id||makeId());while(used.has(id))id=makeId();used.add(id);return{id,name:r.name,cuisine:normalizeCuisine(r.cuisine),ingredients:r.ingredients.map(i=>({name:i.name.trim().toLowerCase(),qty:Number(i.qty)||0,unit:String(i.unit||'').trim().toLowerCase()}))}});selectedIds.clear();checkedItems.clear();activeCuisine='All';resetForm();persist();renderRecipes();renderGroceryList();alert('Recipes imported successfully!')}catch(error){alert('Import failed: '+error.message)}finally{event.target.value=''}};reader.onerror=()=>{alert('Unable to read the selected file.');event.target.value=''};reader.readAsText(file)}
el('themeBtn').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));initTheme();el('addIngredientBtn').addEventListener('click',()=>addIngredientRow());el('saveRecipeBtn').addEventListener('click',saveRecipe);el('cancelEditBtn').addEventListener('click',resetForm);el('exportBtn').addEventListener('click',exportRecipes);el('importBtn').addEventListener('click',()=>el('importInput').click());el('importInput').addEventListener('change',importRecipes);el('clearChecksBtn').addEventListener('click',()=>{checkedItems.clear();persist();renderGroceryList()});loadData();addIngredientRow();renderRecipes();renderGroceryList();
</script>
</body>
</html>
